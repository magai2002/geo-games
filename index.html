<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geo Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Geo<span>Games</span></div>
    <div class="hud" id="hud" hidden>
      <div class="hud-item"><span class="hud-label">Score</span><span id="score">0/0</span></div>
      <div class="hud-item"><span class="hud-label">Time</span><span id="timer">0:00</span></div>
      <button class="btn btn-ghost" id="giveUp">Give up</button>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" id="mapWrap">
      <svg id="map" role="img" aria-label="Map"></svg>
      <div class="map-tools">
        <button class="btn-icon" id="zoomIn" title="Zoom in">+</button>
        <button class="btn-icon" id="zoomOut" title="Zoom out">−</button>
        <button class="btn-icon" id="zoomReset" title="Reset view">⟲</button>
      </div>
      <div class="tooltip" id="tooltip" hidden></div>
      <button class="btn btn-primary floating" id="showResults" hidden>Show results</button>

      <!-- Click-mode prompt -->
      <div class="prompt" id="prompt" hidden>
        <span class="prompt-label">Click on</span>
        <span class="prompt-name" id="promptName"></span>
        <span class="prompt-tries" id="promptTries"></span>
      </div>

      <!-- Start / results overlay -->
      <div class="overlay" id="overlay">
        <div class="card" id="menu">
          <h1>Countries of <span id="regionName">Europe</span></h1>
          <p class="muted">Timed map quizzes. Drag to pan, scroll or pinch to zoom.</p>

          <h2>Quiz</h2>
          <div class="choices" id="modeChoices">
            <label class="choice">
              <input type="radio" name="mode" value="type" checked>
              <span class="choice-body">
                <strong>Name them all</strong>
                <small>Type every country before time runs out.</small>
              </span>
            </label>
            <label class="choice">
              <input type="radio" name="mode" value="click">
              <span class="choice-body">
                <strong>Find on the map</strong>
                <small>We name a country, you click it. 3 tries each.</small>
              </span>
            </label>
          </div>

          <h2>Map</h2>
          <div class="choices" id="styleChoices">
            <label class="choice">
              <input type="radio" name="style" value="bordered" checked>
              <span class="choice-body">
                <strong>Borders</strong>
                <small>Country outlines shown.</small>
              </span>
            </label>
            <label class="choice">
              <input type="radio" name="style" value="borderless">
              <span class="choice-body">
                <strong>No borders <em class="tag">Hard</em></strong>
                <small>Just the landmass. Scored separately.</small>
              </span>
            </label>
          </div>

          <p class="best" id="bestLine"></p>
          <button class="btn btn-primary" id="startBtn">Start quiz</button>
        </div>

        <div class="card" id="results" hidden>
          <h1 id="resultTitle">Time's up!</h1>
          <div class="result-score" id="resultScore"></div>
          <p class="muted" id="resultDetail"></p>
          <p class="best" id="resultBest"></p>
          <div class="missed" id="missedWrap">
            <h2>Missed</h2>
            <p id="missedList"></p>
          </div>
          <div class="row">
            <button class="btn btn-primary" id="againBtn">Play again</button>
            <button class="btn btn-ghost" id="menuBtn">Change quiz</button>
            <button class="btn btn-ghost" id="viewMapBtn">View map</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Type-mode panel -->
    <aside class="panel" id="typePanel" hidden>
      <label class="input-label" for="answer">Enter country:</label>
      <input id="answer" class="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. France">
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <ul class="found-list" id="foundList"></ul>
    </aside>
  </main>

  <script src="vendor/d3.min.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
